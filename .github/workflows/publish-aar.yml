name: Publish AAR to GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-aar:
    name: Publish AAR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust renderer
        run: |
          cargo test -p renderer-core
          cargo ndk -t arm64-v8a build --release -p gl-compat

      - name: Install renderer library
        run: |
          install -D \
            target/aarch64-linux-android/release/librust_gl.so \
            android/renderer/src/main/jniLibs/arm64-v8a/librust_gl.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build AAR
        working-directory: android
        run: gradle :renderer:assembleRelease --stacktrace --no-daemon

      - name: Verify AAR
        run: |
          test -f android/renderer/build/outputs/aar/renderer-release.aar
          ls -lh android/renderer/build/outputs/aar/renderer-release.aar

      - name: Upload AAR to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/renderer/build/outputs/aar/renderer-release.aar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
