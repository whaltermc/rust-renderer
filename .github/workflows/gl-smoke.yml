name: GL Bridge Smoke Test

# Separate from the APK build: this exercises the GL translation layer directly on a headless
# software GLES context, so a GL regression is caught without a device or a Minecraft launch.
# The HTML report is published as an artifact.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Render through librust_gl.so
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: cargo test --workspace

      # Mesa's llvmpipe gives a real GLES 3.x context with no GPU.
      - name: Install Mesa software GL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libegl1-mesa-dev libgles2-mesa-dev

      - name: Report EGL/GL stack
        run: |
          { echo "### EGL/GL stack"; echo;
            echo '```'; dpkg -l | grep -E 'libegl1|libgles2|mesa' | awk '{print $2, $3}'; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run smoke test (Mesa llvmpipe)
        run: |
          mkdir -p target/reports
          GLSMOKE_REPORT=target/reports/gl-smoke.html \
          GLSMOKE_SHOT_DIR=target/reports/screenshots \
            ./tools/run-glsmoke.sh 2>&1 | tee target/reports/gl-smoke.log

      # A second stack that goes through a translation layer, like the real device does.
      # Mesa/llvmpipe is a native GLES driver; the device path is GL -> translation -> driver,
      # which is exactly where our host tests stopped predicting the hardware result. ANGLE on
      # lavapipe reproduces that shape without an emulator.
      - name: Run smoke test (ANGLE on lavapipe)
        run: |
          set -euo pipefail
          # The emulator SDK ships a glibc build of ANGLE. Look in the usual roots rather
          # than trusting one path, and skip loudly instead of failing the job when absent.
          ANGLE=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                      /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$root" ] && [ -d "$root/emulator/lib64/gles_angle" ]; then
              ANGLE="$root/emulator/lib64/gles_angle"; break
            fi
          done
          if [ -z "$ANGLE" ]; then
            echo "::notice::ANGLE not found; skipping the translated lane. The Mesa lane still ran."
            exit 0
          fi
          echo "using ANGLE from $ANGLE"
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          FARM="$RUNNER_TEMP/angle-farm"
          mkdir -p "$FARM"
          # MobileGL's recipe, and the reason each symlink is needed: ANGLE's own libEGL
          # dlopens the unsuffixed libGLESv2.so from the same directory, so without that link
          # it loads a truncated entry-point table; libvulkan.so.1 is needed or eglInitialize
          # fails outright.
          ln -sf "$ANGLE/libEGL.so"    "$FARM/libEGL_angle.so"
          ln -sf "$ANGLE/libGLESv2.so" "$FARM/libGLESv2_angle.so"
          ln -sf "$ANGLE/libEGL.so"    "$FARM/libEGL.so"
          ln -sf "$ANGLE/libGLESv2.so" "$FARM/libGLESv2.so"
          ln -sf "$ANGLE/libvulkan.so.1" "$FARM/libvulkan.so.1"

          cc -O1 -o target/release/glsmoke tools/glsmoke.c -lEGL -ldl -lm
          mkdir -p target/reports-angle
          set +e
          LD_LIBRARY_PATH="$FARM:target/release/" \
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
          ANGLE_DEFAULT_PLATFORM=vulkan \
          LIBGL_ALWAYS_SOFTWARE=1 \
          GLSMOKE_REPORT=target/reports-angle/gl-smoke.html \
          GLSMOKE_SHOT_DIR=target/reports-angle/screenshots \
            ./target/release/glsmoke target/release/librust_gl.so \
              2>&1 | tee target/reports-angle/gl-smoke.log
          echo "ANGLE lane exit: $?"
          set -e
          # Guard against a silent no-op: with ANGLE absent the harness quietly falls back
          # to Mesa and reports the same numbers, which would look like the translated lane
          # passed. Require ANGLE in the log, or say plainly that the lane did not run.
          if grep -qi "angle" target/reports-angle/gl-smoke.log; then
            echo "translated lane confirmed: ANGLE is in the stack"
          else
            echo "::notice::ANGLE did not load (harness fell back to Mesa); this lane proves nothing and is reported as not-run."
            rm -f target/reports-angle/gl-smoke.html
            echo "ANGLE did not load; results are Mesa's, not a translated stack." \
              > target/reports-angle/NOT-RUN.txt
          fi

      # Entry-point coverage measured against real Minecraft apitrace captures, from the
      # MobileGL fixture set. A name a real run calls but the library does not export is a
      # NULL function pointer for a client that resolves by dlsym, which is how 1.16.5 died.
      - name: Trace coverage against real Minecraft captures
        run: |
          sudo apt-get install -y --no-install-recommends apitrace
          mkdir -p target/reports
          set +e
          ./tools/trace-coverage.sh 2>&1 | tee target/reports/trace-coverage.log
          echo "trace coverage exit: $?"
          set -e

      - name: Compare lanes
        if: always()
        run: |
          python3 - <<'PY'
          import re, pathlib
          def summary(p):
              try: t = pathlib.Path(p).read_text()
              except OSError: return None
              m = re.search(r"([0-9]+ checks[^<]*)", t)
              return m.group(1) if m else None
          mesa = summary("target/reports/gl-smoke.html")
          ang = summary("target/reports-angle/gl-smoke.html")
          with open("target/reports/lane-comparison.md", "w") as f:
              f.write("# GL smoke lanes\n\n")
              f.write(f"- Mesa llvmpipe: {mesa or 'did not run'}\n")
              f.write(f"- ANGLE on lavapipe: {ang or 'did not run'}\n\n")
              f.write("A check that passes on Mesa but fails on ANGLE is the signature of a\n"
                      "translation-layer bug, which is what a real device exercises.\n")
          print(pathlib.Path("target/reports/lane-comparison.md").read_text())
          PY

      # A non-zero exit here fails the job on regressions. Known issues are reported as
      # "known" in the HTML rather than failing, so a documented limitation stays visible
      # without blocking unrelated work.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-smoke-report
          path: |
            target/reports/gl-smoke.html
            target/reports/gl-smoke.log
            target/reports/screenshots/
            target/reports-angle/
            target/reports/trace-coverage.log
            target/reports/lane-comparison.md
          if-no-files-found: error

      - name: Summarise
        if: always()
        run: |
          {
            echo "### GL smoke test"
            echo
            if [ -f target/reports/gl-smoke.html ]; then
              echo "[Report](artifact) — gl-smoke-report"
              echo
              grep -oE '[0-9]+ checks[^<]*' target/reports/gl-smoke.html | head -1 || true
              echo
              ls target/reports/screenshots/ 2>/dev/null | sed 's/^/- screenshot: /' || true
            else
              echo "No report was produced; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
