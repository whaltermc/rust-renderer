name: GL Bridge Smoke Test

# Separate from the APK build: this exercises the GL translation layer directly on a headless
# software GLES context, so a GL regression is caught without a device or a Minecraft launch.
#
# The harness does two kinds of check. It renders and compares pixels, and -- more usefully --
# it sends desktop GL calls through the bridge and asserts which ES entry points the bridge
# actually invoked. That is what turns "OpenGL error 1282" into a named failing call.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run on the same ref; the older one is wasted minutes.
concurrency:
  group: gl-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Render through librust_gl.so
    runs-on: ubuntu-24.04
    # The apitrace replay builds a lot of C++. A hung download or build should fail visibly
    # rather than sit until GitHub's 6 hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        # Pinned, not `stable`: a floating toolchain means CI can compile a different compiler
        # than the one this was verified against, which is not a failure worth debugging.
        uses: dtolnay/rust-toolchain@1.99.0

      # Reuses compiled dependencies between runs. The workspace builds gl-compat several
      # times (tests, smoke, each retrace), so a cold cache is most of the job's runtime.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p target/reports
          cargo test --workspace 2>&1 | tee target/reports/unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo "### Unit tests failed (exit $status)"; echo;
              echo '```'; tail -60 target/reports/unit-tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Install Mesa software GL and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libegl1-mesa-dev libgles2-mesa-dev mesa-utils \
            cmake build-essential python3 curl

      - name: Report EGL/GL stack
        run: |
          { echo "### EGL/GL stack"; echo;
            echo '```'; dpkg -l | grep -E 'libegl1|libgles2|mesa' | awk '{print $2, $3}'; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      # RENDERER_TRACE_GL=all keeps the whole call sequence rather than a ring of the last few,
      # which the translation-contract checks need. A non-zero exit here is a regression and
      # fails the job; known issues are reported in the HTML without one.
      - name: Run smoke test (Mesa llvmpipe)
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=all GLSMOKE_CONTRACT=1 \
            ./tools/run-glsmoke.sh 2>&1 | tee target/reports/gl-smoke.log

      # A second stack that goes through a translation layer, like the real device does. Mesa is
      # a native GLES driver and does not exercise translation at all, which is why the host
      # suite could go green while the device crashed. Needs the emulator SDK's ANGLE, so it
      # skips rather than fails when that is absent.
      - name: Run smoke test (ANGLE on lavapipe)
        run: |
          FARM="$RUNNER_TEMP/angle-farm"
          mkdir -p "$FARM" target/reports-angle
          ANGLE=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                      /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$root" ] && [ -d "$root/emulator/lib64/gles_angle" ]; then
              ANGLE="$root/emulator/lib64/gles_angle"; break
            fi
          done
          if [ -z "$ANGLE" ]; then
            echo "::notice::ANGLE not found; skipping the translated lane."
            echo "::notice::Install it with: sdkmanager 'emulator' 'platform-tools'"
            echo "ANGLE not found; lane skipped." > target/reports-angle/NOT-RUN.txt
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          echo "using ANGLE from $ANGLE"
          # MobileGL's recipe, and why each symlink is needed: ANGLE's libEGL dlopens the
          # unsuffixed libGLESv2.so from its own directory, so without that link it loads a
          # truncated entry-point table; libvulkan.so.1 is needed or eglInitialize fails.
          ln -sf "$ANGLE/libEGL.so"       "$FARM/libEGL_angle.so"
          ln -sf "$ANGLE/libGLESv2.so"    "$FARM/libGLESv2_angle.so"
          ln -sf "$ANGLE/libEGL.so"       "$FARM/libEGL.so"
          ln -sf "$ANGLE/libGLESv2.so"    "$FARM/libGLESv2.so"
          ln -sf "$ANGLE/libvulkan.so.1"  "$FARM/libvulkan.so.1"
          mkdir -p target/release
          cc -O1 -o target/release/glsmoke tools/glsmoke.c -lEGL -ldl -lm
          set +e
          LD_LIBRARY_PATH="$FARM:target/release/" \
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
          ANGLE_DEFAULT_PLATFORM=vulkan \
          LIBGL_ALWAYS_SOFTWARE=1 \
          RENDERER_TRACE_GL=all GLSMOKE_CONTRACT=1 \
            ./target/release/glsmoke target/release/librust_gl.so \
              2>&1 | tee target/reports-angle/gl-smoke.log
          set -e
          # Guard against a silent no-op: without ANGLE the harness quietly falls back to Mesa
          # and reports the same numbers, which would read as the translated lane passing.
          if grep -qi "angle" target/reports-angle/gl-smoke.log; then
            echo "translated lane confirmed: ANGLE is in the stack"
          else
            echo "::notice::ANGLE did not load (fell back to Mesa); this lane proves nothing."
            echo "ANGLE did not load; these results are Mesa's." \
              > target/reports-angle/NOT-RUN.txt
          fi

      # Entry-point coverage measured against real Minecraft apitrace captures from the
      # MobileGL fixture set. Network-dependent, so it reports rather than gates.
      - name: Trace coverage against real Minecraft captures
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends apitrace
          mkdir -p target/reports
          ./tools/trace-coverage.sh 2>&1 | tee target/reports/trace-coverage.log

      - name: Initialize apitrace replay dependency
        run: git submodule update --init --recursive --depth 1 tools/trace_replay/vendor/apitrace

      # The 1.21.4 fixtures are downloaded from the MobileGL repo. Caching them means a flaky
      # download or a moved file only fails the first run, not every run.
      - name: Cache replay fixtures
        uses: actions/cache@v4
        with:
          path: target/trace-replay/downloads
          key: trace-fixtures-${{ hashFiles('tools/trace_replay/run_fixture.sh') }}

      - name: Retrace Minecraft 1.21.4 through Rust renderer
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4 \
            2>&1 | tee target/reports/minecraft-1.21.4-retrace.log

      - name: Retrace Minecraft 1.21.4 world through Rust renderer
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4-world \
            2>&1 | tee target/reports/minecraft-1.21.4-world-retrace.log

      - name: Diagnose Minecraft 1.21.4 Iris shader pack
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4-shaders \
            2>&1 | tee target/reports/minecraft-1.21.4-shaders-retrace.log

      - name: Compare lanes
        if: always()
        run: |
          mkdir -p target/reports
          python3 tools/compare-lanes.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-smoke-report
          # warn, not error: the ANGLE lane legitimately skips without the emulator SDK, so
          # target/reports-angle/ may not exist. Erroring on that failed the job for a
          # non-problem.
          if-no-files-found: warn
          path: |
            target/reports/gl-smoke.html
            target/reports/gl-smoke.log
            target/reports/screenshots/
            target/reports-angle/
            target/reports/trace-coverage.log
            target/reports/minecraft-1.21.4-retrace.log
            target/reports/minecraft-1.21.4-world-retrace.log
            target/reports/minecraft-1.21.4-shaders-retrace.log
            target/reports/unit-tests.log
            target/reports/lane-comparison.md
            target/trace-replay/results/

      # Puts the tail of every log in the job summary, so a red run shows its cause without
      # downloading the artifact.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### GL smoke test"
            echo
            if [ -f target/reports/gl-smoke.html ]; then
              echo "Report and screenshots are in the **gl-smoke-report** artifact."
              echo
              grep -oE '[0-9]+ checks[^<]*' target/reports/gl-smoke.html | head -1 || true
            else
              echo "No report was produced; see the job log."
            fi
            if [ -f target/reports/lane-comparison.md ]; then
              echo
              cat target/reports/lane-comparison.md
            fi
            for f in gl-smoke minecraft-1.21.4-retrace minecraft-1.21.4-world-retrace; do
              if [ -f "target/reports/$f.log" ]; then
                echo
                echo "<details><summary>$f.log (last 25 lines)</summary>"
                echo
                echo '```'
                tail -25 "target/reports/$f.log"
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          
