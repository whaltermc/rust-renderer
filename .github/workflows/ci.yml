name: Retrace Fixtures

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrace:
    name: Retrace Fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust renderer for Android
        run: |
          cargo test -p renderer-core
          cargo ndk -t arm64-v8a build --release -p gl-compat

      - name: Install renderer library
        run: |
          install -D \
            target/aarch64-linux-android/release/librust_gl.so \
            android/app/src/main/jniLibs/arm64-v8a/librust_gl.so

          install -D \
            target/aarch64-linux-android/release/librust_gl.so \
            android/renderer/src/main/jniLibs/arm64-v8a/librust_gl.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Cache replay fixtures
        uses: actions/cache@v4
        with:
          path: target/trace-replay/downloads
          key: trace-fixtures-${{ hashFiles('tools/trace_replay/run_fixture.sh') }}

      - name: Make fixture script executable
        run: chmod +x tools/trace_replay/run_fixture.sh

      - name: Retrace Minecraft 1.21.4
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4 \
            2>&1 | tee target/reports/minecraft-1.21.4-retrace.log

      - name: Retrace Minecraft 1.21.4 world
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4-world \
            2>&1 | tee target/reports/minecraft-1.21.4-world-retrace.log

      - name: Retrace Minecraft 1.21.4 shaders (Iris/BSL)
        run: |
          set -o pipefail
          mkdir -p target/reports
          RENDERER_TRACE_GL=1 tools/trace_replay/run_fixture.sh 1.21.4-shaders \
            2>&1 | tee target/reports/minecraft-1.21.4-shaders-retrace.log

      - name: Generate HTML report
        run: |
          mkdir -p target/reports
          python3 tools/generate_retrace_html.py target/trace-replay/results target/reports/retrace-report.html

      - name: Upload retrace reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrace-reports
          path: |
            target/reports/
            target/trace-replay/results/
          if-no-files-found: warn