name: Renderer Tool

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool:
    name: Renderer Tool
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GLES/EGL libraries for renderer tool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgles1 \
            libegl-dev libgles-dev \
            libgl1 libglx-mesa0 \
            mesa-va-drivers mesa-vdpau-drivers \
            libglvnd0 libglx0 libegl-mesa0

      - name: Build Rust renderer for host (for tool)
        run: |
          cargo build --release -p gl-compat

      - name: Build C++ renderer tool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake libegl-dev libgles-dev libgl-dev
          cmake -S tools/renderer-tool -B build/renderer-tool -DCMAKE_BUILD_TYPE=Release
          cmake --build build/renderer-tool --config Release -j

      - name: Run renderer tool (ES vs VK)
        run: |
          mkdir -p target/reports
          ./build/renderer-tool/renderer-tool target/release/librust_gl.so --output-dir target/reports 2>&1 | tee target/reports/renderer-tool.log
          if [ -f target/reports/report.json ]; then
            PASSED=$(grep -o '"passed":[^,]*' target/reports/report.json | head -1 | grep -o '[^:]*$' | tr -d ' ')
            if [ "$PASSED" != "true" ]; then
              echo "Renderer tool reported failure"
              exit 1
            fi
          else
            echo "Report file not found"
            exit 1
          fi

      - name: Build trace replay tool
        run: |
          git submodule update --init --depth 1 --recursive tools/trace_replay/vendor/apitrace
          cmake -S tools/trace_replay -B build/trace-replay -DCMAKE_BUILD_TYPE=Release
          cmake --build build/trace-replay --config Release -j

      - name: Run trace replay (Minecraft 1.17 main menu, benchmark mode)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 3.3
          MESA_GLSL_VERSION_OVERRIDE: 330
        run: |
          mkdir -p target/trace-replay/fixtures/1.17 target/trace-replay/results/1.17
          tar -xzf tools/trace_replay/fixtures/minecraft-1.17-main-menu-854.tgz -C target/trace-replay/fixtures/1.17
          ./build/trace-replay/rust_renderer_trace_replay \
            --trace target/trace-replay/fixtures/1.17/trace.trace \
            --output target/trace-replay/results/1.17 \
            --backend DirectGLES \
            --renderer-library target/release/librust_gl.so \
            --width 854 \
            --height 480 \
            --benchmark \
            --benchmark-tail-frames 2 \
            --benchmark-result target/trace-replay/results/1.17/benchmark.json 2>&1 | tee target/trace-replay/results/1.17/benchmark.log
          if [ ! -f target/trace-replay/results/1.17/benchmark.json ]; then
            echo "Trace replay benchmark result not found"
            exit 1
          fi

      - name: Upload tool reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-tool-reports
          path: |
            target/reports/
            target/trace-replay/results/
          if-no-files-found: warn