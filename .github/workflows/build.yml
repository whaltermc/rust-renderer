name: Build Renderer Plugin APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Show tool versions
        run: |
          java -version
          rustc --version
          cargo --version
          cargo ndk --version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Rust renderer
        run: |
          cargo test -p renderer-core

          cargo ndk \
            -t arm64-v8a \
            build \
            --release \
            -p gl-compat

      - name: Verify Rust library
        run: |
          test -f target/aarch64-linux-android/release/librust_gl.so
          file target/aarch64-linux-android/release/librust_gl.so
          ls -lh target/aarch64-linux-android/release/librust_gl.so

      - name: Copy renderer into Android project
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp \
            target/aarch64-linux-android/release/librust_gl.so \
            android/app/src/main/jniLibs/arm64-v8a/librust_gl.so

          ls -lh android/app/src/main/jniLibs/arm64-v8a/librust_gl.so

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-renderer-plugin
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error