name: build-plugin-apk
on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: cargo install cargo-ndk
      - name: Build native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | tail -1)"
          cargo test -p renderer-core
          cargo ndk -t arm64-v8a build --release -p gl-compat
          install -D target/aarch64-linux-android/release/librust_gl.so \
            android/app/src/main/jniLibs/arm64-v8a/librust_gl.so
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rust-renderer-plugin
          path: android/app/build/outputs/apk/debug/app-debug.apk
