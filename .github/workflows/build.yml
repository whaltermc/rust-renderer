name: Build Renderer Plugin APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          java -version
          rustc --version
          cargo --version
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" --version

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Build Rust renderer
        run: |
          cargo test -p renderer-core

          cargo ndk \
            -t arm64-v8a \
            build \
            --release \
            -p gl-compat

      - name: Verify Rust library
        run: |
          test -f target/aarch64-linux-android/release/librust_gl.so
          file target/aarch64-linux-android/release/librust_gl.so
          ls -lh target/aarch64-linux-android/release/librust_gl.so

      - name: Copy renderer library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp \
            target/aarch64-linux-android/release/librust_gl.so \
            android/app/src/main/jniLibs/arm64-v8a/librust_gl.so

          ls -lh android/app/src/main/jniLibs/arm64-v8a/librust_gl.so

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-renderer-plugin
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error